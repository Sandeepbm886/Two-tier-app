<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DevOps Message App</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>DevOps Message App</h1>

      <form id="messageForm">
        <input
          type="text"
          id="messageInput"
          placeholder="Enter your message"
          required
        />

        <button type="submit">
          Send
        </button>
      </form>

      <h2>Messages</h2>

      <div id="messages"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
