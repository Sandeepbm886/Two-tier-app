services:

  app:
    build: .
    container_name: devops-app
    ports:
      - "3000:3000"
    environment:
      POSTGRES_URI: postgres://postgres:postgres@postgres:5432/devopsapp
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devopsapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
